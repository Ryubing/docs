name: Deploy Docs

on:
  push:
    tags:
      - '*'
    branches:
      - 'master'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5    
    
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11.12'

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: Setup Project
      run: |
        uv sync --locked --all-extras --dev

    - name: Build Ryu docs
      run: uv run zensical build --clean --config-file mkdocs.yml

    - name: Push to the gh-pages branch
      uses: cpina/github-action-push-to-another-repository@main
      env:
        API_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
      with:
        source-directory: 'site'
        destination-github-username: 'Ryubing'
        destination-repository-name: 'docs'
        user-name: "GitHub Actions on behalf of GreemDev"
        user-email: greemdev@ryujinx.app
        target-branch: gh-pages